services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-ai-enterprise-playground}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      API_VERSION: ${API_VERSION:-v1}
      VERSION: ${VERSION:-0.1.0}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/data/chroma}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-30}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-14}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev-session-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://playground.pangliantagege.top/auth/github/callback}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ai_app_data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  ai_app_data:

