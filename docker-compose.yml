services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-ai-enterprise-playground}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      API_VERSION: ${API_VERSION:-v1}
      VERSION: ${VERSION:-0.1.0}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/data/chroma}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-30}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-14}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev-session-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ai_app_data:/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_playground}
      POSTGRES_USER: ${POSTGRES_USER:-ai_playground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_playground}
    ports:
      - "5432:5432"
    volumes:
      - ai_pg_data:/var/lib/postgresql/data

volumes:
  ai_pg_data:
  ai_app_data:
